id: observability
title: Observability stack
summary: Prometheus for metrics, Grafana for dashboards, Loki for logs, plus cAdvisor and a Postgres exporter.
requires: []
conflicts: []
# Grafana, Prometheus and Loki are published by hostname through Traefik, so
# they take no host port. Only cAdvisor does.
host_ports:
  - 8082
secrets:
  # Grafana runs as uid 472 and reads the password from the mounted secret,
  # so the file has to be owned by that uid — Docker preserves the host
  # file's mode and owner on the mount.
  #   name: {bytes: <hex bytes>, uid: <owner uid, 0 = leave alone>}
  grafana_password: {bytes: 32, uid: 472}
  # The token Prometheus presents when it scrapes the platform's metrics.
  # The metrics name every project, so the scrape is a credential and not an
  # open door. Prometheus runs as nobody (65534), so the file has to be
  # owned by that uid — Docker preserves the host file's mode and owner on
  # the mount.
  prometheus_token: {bytes: 32, uid: 65534}
