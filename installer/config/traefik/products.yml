# Static routes for the products that share this host.
#
# The FIDScript platform's Traefik is the single edge. The Instant BaaS,
# the WhatsApp platform, the npm registry and the Maven repository each
# serve their own console on their own hostname; these routes point at
# those consoles so everything is reachable under one domain.
#
# The upstreams are container names on the networks the platform's Traefik
# joins (see installer/docker/docker-compose.yml). Host services are
# reached through host.docker.internal, which Docker resolves to the
# bridge gateway — the subnet changes when the networks are recreated, so
# a hardcoded address would break without warning.
#
# __DOMAIN__ is the platform's domain. The installer substitutes it when it
# publishes this file, exactly as it does for platform.yml. The nextmavens
# names are a different domain and stay literal.

http:
  routers:
    # ── Instant BaaS ────────────────────────────────────────────────────────
    instant-console:
      rule: 'Host(`instant.__DOMAIN__`)'
      service: instant-console
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }
    instant-api:
      rule: 'Host(`apiinstant.__DOMAIN__`)'
      service: instant-api
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }
    instant-realtime:
      rule: 'Host(`realtime.__DOMAIN__`)'
      service: instant-api
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }
    instant-cli:
      rule: 'Host(`cliinstant.__DOMAIN__`)'
      service: instant-api
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }
    instant-mcp:
      rule: 'Host(`instantmcp.__DOMAIN__`)'
      service: instant-mcp
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }
    maven-repository:
      rule: 'Host(`maven.__DOMAIN__`)'
      service: maven-repository
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }

    # ── WhatsApp platform ───────────────────────────────────────────────────
    # The nextmavens.com names live in a different Cloudflare zone, so they
    # get their OWN router and their own certificate. One router covering
    # both zones asks for a single certificate, the token cannot solve the
    # other zone's challenge, and the whole request fails — taking the
    # fidscript.com name down with it.
    #
    # DNS-01 rather than HTTP-01: an HTTP-01 challenge needs port 80 to be
    # reachable from the internet, and on a host whose only public entry is
    # a proxied HTTPS one it is not.
    whatsapp-console:
      rule: 'Host(`whatsapp.__DOMAIN__`)'
      service: whatsapp-console
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }
    whatsapp-console-nextmavens:
      rule: 'Host(`whatsapp.nextmavens.com`)'
      service: whatsapp-console
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }
    whatsapp-api:
      rule: 'Host(`whatsappapi.__DOMAIN__`)'
      service: whatsapp-api
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }

    # ── npm registry ────────────────────────────────────────────────────────
    npm-registry:
      rule: 'Host(`registry.__DOMAIN__`)'
      service: npm-registry
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }
    npm-registry-nextmavens:
      rule: 'Host(`registry.nextmavens.com`)'
      service: npm-registry
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }

    # ── artifact storage for mobile and desktop builds ──────────────────────
    artifacts:
      rule: 'Host(`files.__DOMAIN__`)'
      service: artifacts
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }
    artifacts-nextmavens:
      rule: 'Host(`storage.nextmavens.com`)'
      service: artifacts
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt-dns }

  services:
    instant-console:
      loadBalancer:
        servers:
          - url: "http://self-hosting-www-1:3000"
    instant-api:
      loadBalancer:
        servers:
          - url: "http://self-hosting-server-1:8888"
    instant-mcp:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4876"
    maven-repository:
      loadBalancer:
        servers:
          - url: "http://self-hosting-maven-repository-1:8081"
    whatsapp-console:
      loadBalancer:
        servers:
          - url: "http://whatsapp-nextmavens:3000"
    whatsapp-api:
      loadBalancer:
        servers:
          - url: "http://platform-api:8080"
    npm-registry:
      loadBalancer:
        servers:
          - url: "http://nextmavens-verdaccio:4873"
    artifacts:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4877"
