# WhatsApp platform add-on.
#
# The Evolution API provides the WhatsApp channels (Baileys / Meta /
# Evolution). The web console is the pre-built SPA in this directory; it
# proxies the SaaS routes to the PLATFORM api and the channel routes to
# the Evolution API.
#
# The management layer (projects, API keys, instances) is a separate
# service behind the `management` profile: the copy of the source in this
# repository is missing files the image build needs (apps/whatsapp-api/
# manager/ and the chatbot integrations), so the operator has to supply a
# built image:
#   docker compose --profile management up -d

services:
  whatsapp-postgres:
    image: postgres:15-alpine
    container_name: fidscript_whatsapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: "${WHATSAPP_POSTGRES_PASSWORD}"
    volumes:
      - fidscript_whatsapp_postgres:/var/lib/postgresql/data
    networks:
      - fidscript-whatsapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  whatsapp-redis:
    image: redis:7-alpine
    container_name: fidscript_whatsapp_redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$(cat /run/secrets/whatsapp_redis_password)\" --appendonly yes"]
    secrets:
      - whatsapp_redis_password
    volumes:
      - fidscript_whatsapp_redis:/data
    networks:
      - fidscript-whatsapp
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$(cat /run/secrets/whatsapp_redis_password)\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: fidscript_evolution_api
    restart: unless-stopped
    depends_on:
      whatsapp-postgres:
        condition: service_healthy
      whatsapp-redis:
        condition: service_healthy
    environment:
      SERVER: "true"
      NODE_ENV: production
      PORT: "8080"
      DATABASE_CONNECTION_URI: "postgresql://whatsapp:${WHATSAPP_POSTGRES_PASSWORD}@whatsapp-postgres:5432/whatsapp?schema=public"
      # The value is "postgresql", not "postgres" — anything else is
      # rejected with "Database provider postgres invalid".
      DATABASE_PROVIDER: "postgresql"
      REDIS_URL: "redis://:${WHATSAPP_REDIS_PASSWORD}@whatsapp-redis:6379/0"
      REDIS_CONNECTION_URI: "redis://:${WHATSAPP_REDIS_PASSWORD}@whatsapp-redis:6379/0"
      AUTHENTICATION_API_KEY: "${WHATSAPP_AUTHENTICATION_API_KEY:-change-me}"
      # The Evolution API issues the QR code the operator scans to link a
      # WhatsApp account. Persisted so it survives a restart.
      INSTANCE_EXTERNAL_STORAGE: "S3"
      STORAGE_S3_ENDPOINT: "http://fidscript_whatsapp_storage:9000"
      STORAGE_S3_ACCESS_KEY: "${WHATSAPP_STORAGE_ACCESS_KEY:-minioadmin}"
      STORAGE_S3_SECRET_KEY: "${WHATSAPP_STORAGE_SECRET_KEY:-minioadmin}"
      STORAGE_S3_BUCKET: whatsapp-instances
    secrets:
      - whatsapp_redis_password
    volumes:
      - fidscript_whatsapp_instances:/fidscript/instances
    ports:
      - "${WHATSAPP_API_PORT:-8080}:8080"
    networks:
      - fidscript-whatsapp
    healthcheck:
      # The Evolution image has no curl or wget — probe with node.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  whatsapp-storage:
    image: rustfs/rustfs:1.0.4
    container_name: fidscript_whatsapp_storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "${WHATSAPP_STORAGE_ACCESS_KEY:-minioadmin}"
      RUSTFS_SECRET_KEY: "${WHATSAPP_STORAGE_SECRET_KEY:-minioadmin}"
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - fidscript_whatsapp_storage:/data
    networks:
      - fidscript-whatsapp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  whatsapp-frontend:
    image: nginx:alpine
    container_name: fidscript_whatsapp_frontend
    restart: unless-stopped
    volumes:
      - ../addons/whatsapp/frontend.dist:/usr/share/nginx/html:ro
      - ../addons/whatsapp/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WHATSAPP_FRONTEND_PORT:-8090}:80"
    networks:
      - fidscript-whatsapp
      - fidscript-deployment
    depends_on:
      - evolution-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # The management layer: projects, per-project API keys, instance
  # registry. Behind a profile because it needs an image the operator has
  # to build and publish themselves.
  whatsapp-api:
    image: "${WHATSAPP_API_IMAGE:-fidscript-whatsapp-api:latest}"
    container_name: fidscript_whatsapp_api
    restart: unless-stopped
    profiles: ["management"]
    env_file:
      - ../addons/whatsapp/whatsapp-api.env
    environment:
      NODE_ENV: production
      PORT: "3099"
      API_INTERNAL_URL: http://fidscript_whatsapp_api:3099
      EVOLUTION_API_URL: http://fidscript_evolution_api:8080
      DATABASE_CONNECTION_URI: "postgresql://whatsapp:${WHATSAPP_POSTGRES_PASSWORD}@whatsapp-postgres:5432/whatsapp?schema=public"
      REDIS_CONNECTION_URI: "redis://:${WHATSAPP_REDIS_PASSWORD}@whatsapp-redis:6379/0"
    secrets:
      - whatsapp_redis_password
    volumes:
      - ./secrets:/run/secrets:ro
    networks:
      - fidscript-whatsapp
      - fidscript-deployment
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3099/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  fidscript_whatsapp_postgres:
    name: fidscript_whatsapp_postgres
  fidscript_whatsapp_redis:
    name: fidscript_whatsapp_redis
  fidscript_whatsapp_storage:
    name: fidscript_whatsapp_storage
  fidscript_whatsapp_instances:
    name: fidscript_whatsapp_instances

networks:
  fidscript-whatsapp:
    name: fidscript-whatsapp
    driver: bridge

secrets:
  whatsapp_redis_password:
    file: ./secrets/whatsapp_redis_password.txt
