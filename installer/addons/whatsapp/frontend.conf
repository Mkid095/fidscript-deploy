server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The upstreams are resolved at REQUEST time, not at start-up. nginx
    # resolves a literal hostname in proxy_pass while it loads the config,
    # so a single upstream that is down (or still starting) makes nginx
    # refuse to start at all. With a variable + Docker's embedded DNS
    # resolver, the console comes up regardless and returns 502 for the
    # routes whose upstream is unavailable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fidscript_api "fidscript_api:3001";
    set $fidscript_evolution_api "fidscript_evolution_api:8080";

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html — never cache
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # Hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ─── SaaS Backend Routes (fidscript_api:3001) ───
    # WhatsApp Console auth — fidscript_api exposes /api/auth/* for magic-code login
    location /api/auth/ {
        proxy_pass http://$fidscript_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Origin;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Stats
    location /api/stats {
        proxy_pass http://$fidscript_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Origin;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # SaaS instance create/list/settings/connect/logout/delete
    # (these require JWT auth and use evolution_name translation)
    location /api/instance/client-create {
        proxy_pass http://$fidscript_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://whatsapp.fidscript.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
    location /api/instance/client-instances {
        proxy_pass http://$fidscript_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://whatsapp.fidscript.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
    location /api/instance/client-settings {
        proxy_pass http://$fidscript_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://whatsapp.fidscript.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Connect / disconnect / connectionState — proxy to SaaS backend so JWT auth applies
    # and evolution_name mapping works correctly
    location ~ ^/api/instance/(connect|logout|connectionState|delete)/(.+)$ {
        proxy_pass http://$fidscript_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://whatsapp.fidscript.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Payments
    location /api/payments/ {
        proxy_pass http://$fidscript_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://whatsapp.fidscript.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Versions, platforms, etc.
    location /api/versions/ {
        proxy_pass http://$fidscript_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://whatsapp.fidscript.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
    location /api/platform/ {
        proxy_pass http://$fidscript_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://whatsapp.fidscript.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # SSE
    location /api/sse/ {
        proxy_pass http://$fidscript_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://whatsapp.fidscript.com;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ─── WhatsApp API Routes (fidscript_whatsapp_api:3099) ───
    # Routes are at root, strip /api prefix

    location /api/webhook/ {
        rewrite ^/api(/.*) $1 break;
        proxy_pass http://$fidscript_evolution_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://whatsapp.fidscript.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Generic API catchall (handles /api/instance/connect, /api/instance/fetchInstances, etc.)
    # Strips /api prefix, forwards to WhatsApp API
    location /api/ {
        rewrite ^/api(/.*) $1 break;
        proxy_pass http://$fidscript_evolution_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://whatsapp.fidscript.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
