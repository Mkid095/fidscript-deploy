# Instant BaaS add-on.
#
# A complete InstantDB-compatible backend, the same shape as the upstream
# self-hosting stack:
#
#   postgres    the database, with logical replication (Instant's change
#               streams are built on it)
#   server      the Instant backend — the query layer and the realtime
#               websocket API
#   console     the web console (the Instant "dashboard" image)
#   maven       a Maven repository serving the Kotlin/Android SDK, which
#               is how a Kotlin app consumes Instant
#   storage     S3-compatible object storage for app backups
#   init        creates the storage bucket once, then exits
#
# The console needs to know where the backend is reachable from the
# browser, so INSTANT_API_HOST and friends are read from
# installer/docker/.env. They are NOT generated — they are public
# hostnames and only the operator knows them.

services:
  instant-postgres:
    image: ghcr.io/instantdb/postgresql:postgresql-17-pg-hint-plan
    container_name: fidscript_instant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${INSTANT_POSTGRES_PASSWORD}"
      POSTGRES_USER: "${INSTANT_POSTGRES_USER:-instant}"
      POSTGRES_DB: "${INSTANT_POSTGRES_DB:-instant}"
    volumes:
      - fidscript_instant_postgres:/var/lib/postgresql/data
    networks:
      - fidscript-instant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INSTANT_POSTGRES_USER:-instant} -d ${INSTANT_POSTGRES_DB:-instant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_preload_libraries=pg_hint_plan
      - -c
      - random_page_cost=1.1
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  instant-storage:
    image: rustfs/rustfs:1.0.4
    container_name: fidscript_instant_storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "${INSTANT_MINIO_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${INSTANT_MINIO_SECRET_KEY}"
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - fidscript_instant_storage:/data
    networks:
      - fidscript-instant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  instant-init:
    image: amazon/aws-cli:latest
    container_name: fidscript_instant_init
    restart: "no"
    depends_on:
      instant-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: "${INSTANT_MINIO_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${INSTANT_MINIO_SECRET_KEY}"
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 30); do
          if aws --endpoint-url http://instant-storage:9000 s3 ls >/dev/null 2>&1; then break; fi
          sleep 2
        done
        aws --endpoint-url http://instant-storage:9000 s3 mb instant 2>/dev/null || true
        aws --endpoint-url http://instant-storage:9000 s3 mb "${INSTANT_S3_APP_BACKUPS_BUCKET:-app-backups}" 2>/dev/null || true
        echo "instant storage buckets ready"
    networks:
      - fidscript-instant
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  instant-server:
    image: "${INSTANT_SERVER_IMAGE:-ghcr.io/instantdb/server:latest}"
    container_name: fidscript_instant_server
    restart: unless-stopped
    depends_on:
      instant-postgres:
        condition: service_healthy
      instant-init:
        condition: service_completed_successfully
    environment:
      # Keep the change-stream history in Postgres rather than on disk.
      WAL_HISTORY_STORAGE: pg
      DATABASE_URL: "postgresql://${INSTANT_POSTGRES_USER:-instant}:${INSTANT_POSTGRES_PASSWORD}@instant-postgres:5432/${INSTANT_POSTGRES_DB:-instant}?sslmode=disable"
      CONNECTION_POOL_SIZE: "${INSTANT_CONNECTION_POOL_SIZE:-20}"
      # The two URLs the server tells clients to use. The public one is what
      # a browser or app connects to; the internal one is what the server
      # uses for its own callbacks.
      INSTANT_BACKEND_URL: "${INSTANT_BACKEND_URL:-http://localhost:8888}"
      INSTANT_DASHBOARD_URL: "${INSTANT_DASHBOARD_URL:-http://localhost:3000}"
      # The console's sign-in. Google OAuth is optional — leave both empty
      # to use Instant's magic-code email sign-in instead.
      INSTANT_SUPERUSER_EMAIL: "${INSTANT_SUPERUSER_EMAIL:-}"
      # Instant's self-hosted mode. The server bootstraps the override
      # config (encryption keysets) and creates the superuser on first
      # start, so this flag is what makes it do that.
      INSTANT_SELF_HOSTED: "true"
      # The public hosts the console and the clients use. The server
      # embeds them in the setup snippets it hands out.
      INSTANT_DASH_HOST: "${INSTANT_DASH_HOST:-}"
      INSTANT_MAVEN_HOST: "${INSTANT_MAVEN_HOST:-}"
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID: "${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID:-}"
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET: "${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET:-}"
      # Transactional email from the console (magic codes, team invites).
      INSTANT_EMAIL_PROVIDER: "${INSTANT_EMAIL_PROVIDER:-}"
      INSTANT_EMAIL_REPLY_TO: "${INSTANT_EMAIL_REPLY_TO:-}"
      INSTANT_DASHBOARD_EMAIL_SENDER_NAME: "${INSTANT_DASHBOARD_EMAIL_SENDER_NAME:-}"
      INSTANT_DASHBOARD_EMAIL_SENDER_EMAIL: "${INSTANT_DASHBOARD_EMAIL_SENDER_EMAIL:-}"
      INSTANT_APP_EMAIL_SENDER_NAME: "${INSTANT_APP_EMAIL_SENDER_NAME:-}"
      INSTANT_APP_EMAIL_SENDER_EMAIL: "${INSTANT_APP_EMAIL_SENDER_EMAIL:-}"
      INSTANT_TEAM_EMAIL_SENDER_NAME: "${INSTANT_TEAM_EMAIL_SENDER_NAME:-}"
      INSTANT_TEAM_EMAIL_SENDER_EMAIL: "${INSTANT_TEAM_EMAIL_SENDER_EMAIL:-}"
      # The console talks to the storage service for app backups.
      S3_ENDPOINT: "http://instant-storage:9000"
      S3_ACCESS_KEY: "${INSTANT_MINIO_ACCESS_KEY}"
      S3_SECRET_KEY: "${INSTANT_MINIO_SECRET_KEY}"
      S3_BUCKET: instant
      S3_APP_BACKUPS_BUCKET: "${INSTANT_S3_APP_BACKUPS_BUCKET:-app-backups}"
    volumes:
      - fidscript_instant_storage:/data
    ports:
      - "${INSTANT_SERVER_PORT:-8888}:8888"
    networks:
      - fidscript-instant
    healthcheck:
      # The Instant image has curl but no wget.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8888/health/system || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # The web console — the Instant "dashboard" image. This is what serves
  # the project dashboard an operator opens in a browser.
  instant-console:
    image: "${INSTANT_CONSOLE_IMAGE:-ghcr.io/instantdb/dashboard:latest}"
    container_name: fidscript_instant_console
    restart: unless-stopped
    depends_on:
      instant-server:
        condition: service_healthy
    environment:
      # Where the backend is reachable FROM THE BROWSER. The in-network
      # name only works inside Docker, so this has to be the public URL.
      INSTANT_API_URI: "${INSTANT_API_URI:-http://localhost:8888}"
      INSTANT_API_HOST: "${INSTANT_API_HOST:-http://localhost:8888}"
      INSTANT_BACKEND_URL: "${INSTANT_BACKEND_URL:-http://localhost:8888}"
      INSTANT_DASHBOARD_URL: "${INSTANT_DASHBOARD_URL:-http://localhost:3000}"
      INSTANT_DASH_HOST: "${INSTANT_DASH_HOST:-http://localhost:3000}"
      # Where a Kotlin app resolves the Instant SDK from.
      INSTANT_MAVEN_HOST: "${INSTANT_MAVEN_HOST:-http://localhost:8081}"
      # The MCP endpoint, for AI agents driving the backend.
      INSTANT_MCP_URL: "${INSTANT_MCP_URL:-}"
      # The console serves the dashboard and the docs; it also renders the
      # setup snippets for the CLI and the MCP, so the hosts above have to
      # be the PUBLIC ones or the snippets point at localhost.
      NEXT_PUBLIC_SELF_HOSTED: "true"
    ports:
      - "${INSTANT_CONSOLE_PORT:-3000}:3000"
    networks:
      - fidscript-instant
    healthcheck:
      # The published console image is node:22-slim — it has node but no
      # curl or wget.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"

      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Maven repository — serves the Instant Kotlin/Android SDK, which is how
  # a Kotlin app depends on Instant. The artifacts themselves are uploaded
  # into the volume by CI; this just serves them.
  instant-maven:
    image: caddy:2-alpine
    container_name: fidscript_instant_maven
    restart: unless-stopped
    volumes:
      - ../addons/instant/maven/Caddyfile:/etc/caddy/Caddyfile:ro
      - fidscript_instant_maven:/srv/maven
    ports:
      - "${INSTANT_MAVEN_PORT:-8081}:8081"
    networks:
      - fidscript-instant
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  fidscript_instant_postgres:
    name: fidscript_instant_postgres
  fidscript_instant_storage:
    name: fidscript_instant_storage
  fidscript_instant_maven:
    name: fidscript_instant_maven

networks:
  fidscript-instant:
    name: fidscript-instant
    driver: bridge
