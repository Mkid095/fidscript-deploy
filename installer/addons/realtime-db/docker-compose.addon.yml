# Realtime database add-on — an InstantDB-compatible backend.
#
# This is a SEPARATE database from the platform's own Postgres. It exists for
# applications that want Instant's query layer and change streams: the
# Instant server talks to a Postgres with logical replication enabled and
# exposes it over a websocket API.
#
# The `dashboard` service (Instant's web console) is behind a compose
# PROFILE because there is no published upstream image for it — build it
# from the Instant repository and point REALTIME_DB_WWW_IMAGE at it:
#   docker compose --profile dashboard up -d

services:
  realtime-db-postgres:
    image: ghcr.io/instantdb/postgresql:postgresql-17-pg-hint-plan
    container_name: fidscript_realtime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${REALTIME_DB_POSTGRES_PASSWORD}"
      POSTGRES_USER: "${REALTIME_DB_POSTGRES_USER:-instant}"
      POSTGRES_DB: "${REALTIME_DB_POSTGRES_DB:-instant}"
    volumes:
      - fidscript_realtime_postgres:/var/lib/postgresql/data
    networks:
      - fidscript-realtime
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REALTIME_DB_POSTGRES_USER:-instant} -d ${REALTIME_DB_POSTGRES_DB:-instant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      # Logical replication is what Instant's change streams are built on.
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_preload_libraries=pg_hint_plan
      - -c
      - random_page_cost=1.1
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  realtime-db-server:
    image: ghcr.io/instantdb/server:latest
    container_name: fidscript_realtime_server
    restart: unless-stopped
    depends_on:
      realtime-db-postgres:
        condition: service_healthy
    environment:
      # Keep the change-stream history in Postgres rather than on disk.
      WAL_HISTORY_STORAGE: pg
      DATABASE_URL: "postgresql://${REALTIME_DB_POSTGRES_USER:-instant}:${REALTIME_DB_POSTGRES_PASSWORD}@realtime-db-postgres:5432/${REALTIME_DB_POSTGRES_DB:-instant}?sslmode=disable"
      # The API key the client SDKs authenticate with. Override it in
      # installer/docker/.env before exposing this beyond the host.
      INSTANT_API_KEY: "${REALTIME_DB_API_KEY:-change-me}"
      S3_ENDPOINT: "http://realtime-db-storage:9000"
      S3_ACCESS_KEY: "${REALTIME_DB_MINIO_ACCESS_KEY}"
      S3_SECRET_KEY: "${REALTIME_DB_MINIO_SECRET_KEY}"
      S3_BUCKET: instant
    volumes:
      - fidscript_realtime_storage:/data
    ports:
      - "${REALTIME_DB_SERVER_PORT:-8888}:8888"
    networks:
      - fidscript-realtime
    healthcheck:
      # The Instant image has curl but no wget.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8888/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  realtime-db-storage:
    image: rustfs/rustfs:1.0.4
    container_name: fidscript_realtime_storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "${REALTIME_DB_MINIO_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${REALTIME_DB_MINIO_SECRET_KEY}"
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - fidscript_realtime_storage:/data
    networks:
      - fidscript-realtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Creates the `instant` bucket once, then exits. RustFS has no
  # bucket-creation on start, and the Instant server expects it to exist.
  realtime-db-init:
    image: amazon/aws-cli:latest
    container_name: fidscript_realtime_init
    restart: "no"
    depends_on:
      realtime-db-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: "${REALTIME_DB_MINIO_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${REALTIME_DB_MINIO_SECRET_KEY}"
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 30); do
          if aws --endpoint-url http://realtime-db-storage:9000 s3 ls >/dev/null 2>&1; then break; fi
          sleep 2
        done
        aws --endpoint-url http://realtime-db-storage:9000 s3 mb instant 2>/dev/null || true
        echo "realtime-db bucket ready"
    networks:
      - fidscript-realtime
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Instant's web console. Behind a profile because there is no published
  # upstream image — build it from the Instant repository and set
  # REALTIME_DB_WWW_IMAGE to the resulting tag.
  realtime-db-dashboard:
    image: "${REALTIME_DB_WWW_IMAGE:-ghcr.io/instantdb/www:latest}"
    container_name: fidscript_realtime_dashboard
    restart: unless-stopped
    profiles: ["dashboard"]
    depends_on:
      realtime-db-server:
        condition: service_healthy
    environment:
      INSTANT_BACKEND_URL: "http://realtime-db-server:8888"
      INSTANT_API_URI: "http://realtime-db-server:8888"
      INSTANT_API_HOST: "http://localhost:${REALTIME_DB_SERVER_PORT:-8888}"
      INSTANT_DASHBOARD_URL: "http://localhost:${REALTIME_DB_DASHBOARD_PORT:-3003}"
      INSTANT_DASH_HOST: "http://localhost:${REALTIME_DB_DASHBOARD_PORT:-3003}"
    ports:
      - "${REALTIME_DB_DASHBOARD_PORT:-3003}:3000"
    networks:
      - fidscript-realtime
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  fidscript_realtime_postgres:
    name: fidscript_realtime_postgres
  fidscript_realtime_storage:
    name: fidscript_realtime_storage

networks:
  fidscript-realtime:
    name: fidscript-realtime
    driver: bridge
