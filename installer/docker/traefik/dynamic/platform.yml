# Managed by FIDScript Platform — do not edit manually
http:
  middlewares:
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        sslRedirect: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
    compress:
      compress: {}
  routers:
    dashboard-app:
      rule: 'Host(`app.fidscript.com`)'
      service: fidscript-dashboard
      middlewares:
        - security-headers
        - compress
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    dashboard-root:
      rule: 'Host(`fidscript.com`)'
      service: fidscript-dashboard
      middlewares:
        - security-headers
        - compress
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    deployments-wildcard:
      rule: 'HostRegexp(`^[^.]+\.[^.]+\.fidscript.com$`)'
      service: fidscript-api
      middlewares:
        - security-headers
        - compress
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    fidscript-api:
      rule: 'PathPrefix(`/api`) && !Path(`/install.sh`)'
      service: fidscript-api
      middlewares:
        - security-headers
        - compress
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    fidscript-api-host:
      rule: 'Host(`api.fidscript.com`) && PathPrefix(`/api`)'
      service: fidscript-api
      middlewares:
        - security-headers
        - compress
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    install-sh:
      rule: 'Path(`/install.sh`)'
      service: fidscript-api
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    metrics:
      rule: 'Host(`fidscript.com`) && PathPrefix(`/metrics`)'
      service: fidscript-api
      middlewares:
        - security-headers
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    minio-console:
      rule: 'Host(`storage.fidscript.com`)'
      service: fidscript-minio
      middlewares:
        - security-headers
        - compress
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    jmap:
      rule: 'Host(`jmap.fidscript.com`)'
      # The API router claims /api on every host; this wins for its own.
      priority: 100
      service: fidscript-jmap
      middlewares:
        - security-headers
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    stalwart-admin:
      rule: 'Host(`stalwart-admin.fidscript.com`)'
      # The API router claims /api on every host; this wins for its own.
      priority: 100
      service: fidscript-jmap
      middlewares:
        - security-headers
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    webmail:
      rule: 'Host(`webmail.fidscript.com`)'
      # The API router claims /api on every host; this wins for its own.
      priority: 100
      service: fidscript-webmail
      middlewares:
        - security-headers
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
    acme-challenge:
      rule: 'PathPrefix(`/.well-known/acme-challenge/`)'
      service: fidscript-acme
      middlewares:
        - security-headers
      entryPoints:
        - websecure
  services:
    fidscript-api:
      loadBalancer:
        servers:
          - url: http://fidscript_api:3001
    fidscript-dashboard:
      loadBalancer:
        servers:
          - url: http://fidscript_dashboard:3001
    fidscript-minio:
      loadBalancer:
        servers:
          - url: http://fidscript_minio:9001
    fidscript-jmap:
      loadBalancer:
        servers:
          - url: http://fidscript_stalwart:8080
    fidscript-webmail:
      loadBalancer:
        servers:
          # The integrated deployment runs on the host (systemd); the
          # host loopback is reached through host-gateway.
          - url: http://host.docker.internal:3100
    fidscript-acme:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8080
