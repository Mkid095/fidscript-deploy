# Default Traefik dynamic configuration.
#
# Both install paths overwrite this file before the stack starts:
#   - installer/scripts/setup-wizard.sh writes the full domain-aware config
#   - installer/scripts/install.sh writes an IP-fallback config
#
# What ships here is the safe default for anyone who runs `docker compose
# up` directly: one catch-all router on the dashboard, with the API
# reachable on its path prefix. It deliberately contains no hardcoded
# hostnames — the previous version of this file was pinned to a single
# operator's domains (deploy.fidscript.com, emails.fidscript.com,
# whatsappapi.fidscript.com, …) and routed a fresh VPS at hosts that do
# not exist for the person installing it.
http:
  middlewares:
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        sslRedirect: false
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
    compress:
      compress: {}

  routers:
    # API path prefix — must win over the dashboard catch-all.
    api:
      rule: "PathPrefix(`/api`) && !Path(`/install.sh`)"
      service: api
      middlewares:
        - security-headers
        - compress
      priority: 10

    # Install script endpoint.
    install-sh:
      rule: "Path(`/install.sh`)"
      service: api
      priority: 200

    # Prometheus metrics.
    metrics:
      rule: "PathPrefix(`/metrics`)"
      service: api
      middlewares:
        - security-headers
      priority: 10

    # Everything else — the dashboard.
    dashboard:
      rule: "PathPrefix(`/`)"
      service: dashboard
      middlewares:
        - security-headers
        - compress
      priority: 1

  services:
    dashboard:
      loadBalancer:
        servers:
          - url: "http://fidscript_dashboard:3001"
    api:
      loadBalancer:
        servers:
          - url: "http://fidscript_api:3001"
