# Managed by FIDScript Platform — do not edit manually
http:
  routers:
    fidscript-api:
      rule: Host(`api.deploy.fidscript.com`)
      service: fidscript-api
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns

    # Socket.IO endpoint — the dashboard browser opens a WebSocket at
    # https://deploy.fidscript.com/realtime/...  By default Traefik would send
    # that to the dashboard container (Next.js), which has no Socket.IO server
    # and does not proxy WebSocket upgrades. We route "/realtime" and "/socket.io"
    # to the API service so the same cookie/JWT origin the dashboard uses
    # authenticates the connection. Priority ensures this wins over the catch-all.
    fidscript-api-realtime:
      rule: Host(`deploy.fidscript.com`) && (PathPrefix(`/realtime`) || PathPrefix(`/socket.io`))
      service: fidscript-api
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns
      priority: 100

    fidscript-dashboard:
      rule: Host(`deploy.fidscript.com`)
      service: fidscript-dashboard
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-dns

    fidscript-emails:
      rule: Host(`emails.fidscript.com`)
      service: fidscript-stalwart
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-http
      priority: 50
      middlewares:
        - stalwart-host-rewrite

    fidscript-jmap:
      rule: Host(`jmap.deploy.fidscript.com`)
      service: fidscript-stalwart
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt-http
      priority: 50
      middlewares:
        - stalwart-host-rewrite

  middlewares:
    stalwart-host-rewrite:
      headers:
        customRequestHeaders:
          Host: mail.deploy.fidscript.com

  services:
    fidscript-api:
      loadBalancer:
        servers:
          - url: http://fidscript_api:3001

    fidscript-dashboard:
      loadBalancer:
        servers:
          - url: http://fidscript_dashboard:3001

    fidscript-stalwart:
      loadBalancer:
        servers:
          - url: http://10.0.8.2:8080

