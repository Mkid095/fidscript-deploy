version: "3.8"

services:
  api:
    container_name: fidscript_api
    image: nextmavens/fidscript-whatsapp-api:latest
    restart: always
    depends_on:
      - redis
      - fidscript-postgres
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - fidscript_instances:/fidscript/instances
    networks:
      - fidscript-net
      - dokploy-network
    env_file:
      - .env
    expose:
      - "8080"

  frontend:
    container_name: fidscript_frontend
    image: nextmavens/fidscript-manager:latest
    restart: always
    ports:
      - "3000:80"
    networks:
      - fidscript-net

  redis:
    container_name: fidscript_redis
    image: redis:latest
    restart: always
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - fidscript_redis:/data
    networks:
      fidscript-net:
        aliases:
          - fidscript-redis
      dokploy-network:
        aliases:
          - fidscript-redis
    expose:
      - "6379"

  fidscript-postgres:
    container_name: fidscript_postgres
    image: postgres:15
    restart: always
    env_file:
      - .env
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fidscript-net
      - dokploy-network
    expose:
      - "5432"

volumes:
  fidscript_instances:
  fidscript_redis:
  postgres_data:

networks:
  fidscript-net:
    name: fidscript-net
    driver: bridge
  dokploy-network:
    external: true
